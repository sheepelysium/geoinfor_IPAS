<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPAS AI應用規劃師 題庫練習</title>
<meta name="description" content="經濟部 iPAS AI應用規劃師初級/中級歷屆試題線上練習,600 題隨機抽考、選項隨機排列,附解題思路與每個選項的對錯說明。">
<meta property="og:type" content="website">
<meta property="og:title" content="iPAS AI應用規劃師 題庫練習">
<meta property="og:description" content="初級/中級歷屆試題共 600 題,每回合隨機抽 20 題,附 AI 解題詳解。">
<meta property="og:locale" content="zh_TW">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="logo">iPAS 刷題</span>
    <span class="logo-sub">AI應用規劃師 歷屆試題</span>
    <nav>
      <button id="nav-home" class="nav-btn active">練習</button>
      <button id="nav-stats" class="nav-btn">統計</button>
    </nav>
  </div>
</header>

<main>
  <!-- 設定/開始畫面 -->
  <section id="view-setup" class="view">
    <div class="card setup-card">
      <h1>開始練習</h1>
      <div class="field">
        <label>級別</label>
        <div class="seg" id="level-seg">
          <button data-level="junior" class="seg-btn active">初級</button>
          <button data-level="middle" class="seg-btn">中級</button>
        </div>
      </div>
      <div class="field">
        <label>科目範圍</label>
        <div class="seg seg-wrap" id="subject-seg"></div>
      </div>
      <div class="field">
        <label>題目來源</label>
        <div class="seg" id="origin-seg">
          <button data-origin="all" class="seg-btn active">全部</button>
          <button data-origin="past" class="seg-btn">歷屆試題</button>
          <button data-origin="guide" class="seg-btn">學習指引</button>
        </div>
      </div>
      <div class="field muted" id="pool-info"></div>
      <button id="btn-start" class="primary big">隨機抽 20 題 開始</button>
    </div>
  </section>

  <!-- 作答畫面 -->
  <section id="view-quiz" class="view hidden">
    <div class="quiz-head">
      <div class="progress-track"><div id="progress-bar"></div></div>
      <div class="quiz-meta">
        <span id="quiz-pos"></span>
        <span id="quiz-score"></span>
        <button id="btn-next" class="primary hidden">下一題</button>
        <button id="btn-quit" class="ghost small">結束</button>
      </div>
    </div>
    <div class="card" id="question-card"></div>
  </section>

  <!-- 結果畫面 -->
  <section id="view-result" class="view hidden">
    <div class="card result-card">
      <h1 id="result-title"></h1>
      <div id="result-score" class="score-ring"></div>
      <div id="result-breakdown"></div>
      <div class="row-gap">
        <button id="btn-again" class="primary">再來 20 題</button>
        <button id="btn-review" class="ghost">回顧錯題</button>
        <button id="btn-home" class="ghost">回首頁</button>
      </div>
    </div>
    <div id="review-list" class="hidden"></div>
  </section>

  <!-- 統計畫面 -->
  <section id="view-stats" class="view hidden">
    <div class="card">
      <h1>作答統計</h1>
      <div id="stats-content"></div>
      <button id="btn-clear-stats" class="ghost small danger">清除統計資料</button>
    </div>
  </section>
</main>

<footer class="foot">
  題庫來源:<a href="https://ipd.nat.gov.tw/ipas/certification/AIAP/learning-resources" target="_blank" rel="noopener">經濟部 iPAS「AI應用規劃師」官方公告試題</a>(初級 3 梯次、中級 2 梯次,共 600 題),著作權屬原單位所有。<br>
  本站為非營利學習用途,不販售、不投放廣告;詳解由 AI 產生,可能有誤,應試請以官方公告答案為準。
</footer>

<!-- 手帳風確認對話框 -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-msg">
    <p id="modal-msg"></p>
    <div class="row-gap">
      <button id="modal-ok" class="primary">確定</button>
      <button id="modal-cancel" class="ghost">取消</button>
    </div>
  </div>
</div>

<script src="data/questions-junior.js"></script>
<script src="data/questions-middle.js"></script>
<script src="app.js"></script>
</body>
</html>
